repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig\..*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        name: Ruff Lint
        files: ^backend/.*\.py$
        args: [--fix]
      - id: ruff-format
        name: Ruff Format
        files: ^backend/.*\.py$

  - repo: local
    hooks:
      - id: ty
        name: backend ty check
        entry: bash -c "cd backend && poetry run ty check"
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend-eslint
        name: frontend eslint
        entry: bash -lc 'cd frontend && npm run -s lint'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
