repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [--fix, backend]
      - id: ruff-format
        args: [backend]
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: bash -c "cd backend && poetry run ty check"
        language: system
        types: [python]
        pass_filenames: false
