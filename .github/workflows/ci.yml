name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
      - name: Ruff format (check)
        run: poetry run ruff format --check
      - name: Ruff lint
        run: poetry run ruff check
      - name: Ty type check
        run: poetry run ty check

  backend-test:
    needs: backend-lint
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
      - name: Pytest
        run: |
          poetry run pytest \
            --cov \
            --cov-branch \
            --cov-report=json:coverage.json \
            --junitxml=../reports/pytest.xml
      - name: Backend coverage & test summary
        run: |
          python - <<'EOF'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          totals = json.loads(Path("coverage.json").read_text())["totals"]
          lines_pct = totals["percent_covered"]
          stmts_pct = totals["percent_statements_covered"]
          branches_pct = totals["percent_branches_covered"]

          root = ET.parse("../reports/pytest.xml").getroot()

          def get_int_attr(elem, name: str) -> int:
            v = elem.attrib.get(name)
            return int(v) if v is not None else 0

          tests = failures = errors = skipped = 0
          for ts in root.findall("testsuite"):
            tests += get_int_attr(ts, "tests")
            failures += get_int_attr(ts, "failures")
            errors += get_int_attr(ts, "errors")
            skipped += get_int_attr(ts, "skipped")

          passed = tests - failures - errors - skipped

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as s:
            s.write("## Backend Tests\n")
            s.write(f"- Passed: **{passed}**\n")
            s.write(f"- Failed: **{failures}**\n")
            s.write(f"- Errors: **{errors}**\n")
            s.write(f"- Skipped: **{skipped}**\n\n")
            s.write("## Backend Coverage\n")
            s.write(f"- Lines: **{lines_pct:.2f}%**\n")
            s.write(f"- Statements: **{stmts_pct:.2f}%**\n")
            s.write(f"- Branches: **{branches_pct:.2f}%**\n")
          EOF


  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install deps
        run: npm ci
      - name: ESLint
        run: npm run -s lint

  frontend-test:
    needs: frontend-lint
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm run test -- --coverage
      - name: Frontend coverage summary
        run: |
          node <<'EOF'
          const fs = require("fs");

          const s = require("./coverage/coverage-summary.json").total;

          const tr = JSON.parse(fs.readFileSync("./test-results.json", "utf8"));

          const passed = tr.numPassedTests;
          const failed = tr.numFailedTests;
          const total = tr.numTotalTests;

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Frontend Tests\n` +
              `- Passed: **${passed}**\n` +
              `- Failed: **${failed}**\n` +
              `- Total: **${total}**\n\n` +
              `## Frontend Coverage\n` +
              `- Lines: **${s.lines.pct}%**\n` +
              `- Statements: **${s.statements.pct}%**\n` +
              `- Functions: **${s.functions.pct}%**\n` +
              `- Branches: **${s.branches.pct}%**\n`
          );
          EOF

  frontend-build:
      name: Frontend Build Check
      needs: frontend-lint
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: frontend
      steps:
        - uses: actions/checkout@v4
        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"
            cache-dependency-path: "frontend/package-lock.json"
        - run: npm ci
        - run: npm run build
